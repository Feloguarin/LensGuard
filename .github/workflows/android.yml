name: Build and publish Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # Pushes to main use the persistent release key when the repository provides one, so installed
      # builds update in place. Pull requests never receive it and keep a temporary evaluation key.
      - name: Prepare signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.LENSGUARD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lensguard-release.p12"
            echo "LENSGUARD_KEYSTORE=$RUNNER_TEMP/lensguard-release.p12" >> "$GITHUB_ENV"
            echo persistent > dist/signing-mode.txt
          else
            sh scripts/prepare-development-key.sh
            echo evaluation > dist/signing-mode.txt
          fi
      - name: Lint, unit tests and installable release APK
        env:
          LENSGUARD_STORE_PASSWORD: ${{ secrets.LENSGUARD_STORE_PASSWORD }}
          LENSGUARD_KEY_ALIAS: ${{ secrets.LENSGUARD_KEY_ALIAS }}
          LENSGUARD_KEY_PASSWORD: ${{ secrets.LENSGUARD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lint test assembleRelease
      - name: Verify APK signing and prepare checksums
        run: |
          cp app/build/outputs/apk/release/app-release.apk dist/LensGuard.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/LensGuard.apk > dist/signing-certificate.txt
          (cd dist && sha256sum LensGuard.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LensGuard-apk
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/lint-results*
            app/build/reports/tests/
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name LensGuard-apk --dir dist
      - name: Publish GitHub-hosted download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          cp .github/release-notes.md "$RUNNER_TEMP/notes.md"
          if [ "$(cat dist/signing-mode.txt)" = persistent ]; then
            printf '\n**Signing:** signed with the persistent LensGuard release key. Later releases signed with the same key install as in-place updates.\n' >> "$RUNNER_TEMP/notes.md"
          else
            printf '\n**Signing:** evaluation build signed with a temporary development key. A later evaluation build may require uninstalling this one; export your evidence first.\n' >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "evaluation-${GITHUB_RUN_NUMBER}" dist/LensGuard.apk dist/SHA256SUMS.txt dist/signing-certificate.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "LensGuard ${VERSION} · evaluation ${GITHUB_RUN_NUMBER}" --latest \
            --notes-file "$RUNNER_TEMP/notes.md"
